<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="title description">
  <title id="title">UltraCare healthcare management overview</title>
  <desc id="description">An original illustration of a healthcare dashboard showing appointments, care records, and doctor-patient workflows.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#effaff"/>
      <stop offset="1" stop-color="#e8f7f1"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#158b91"/>
      <stop offset="1" stop-color="#3267b2"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#16455c" flood-opacity=".12"/>
    </filter>
  </defs>
  <rect width="1280" height="420" rx="28" fill="url(#background)"/>
  <circle cx="1120" cy="50" r="115" fill="#d4f1e8"/>
  <circle cx="1195" cy="340" r="145" fill="#d9e8fb"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="68" y="52" width="52" height="52" rx="16" fill="url(#accent)"/>
    <path d="M94 64v28M80 78h28" stroke="#fff" stroke-width="7" stroke-linecap="round"/>
    <text x="137" y="76" fill="#17344d" font-size="17" font-weight="700">ULTRACARE HMS</text>
    <text x="137" y="98" fill="#627c8d" font-size="13">Connected care, made easier</text>
    <text x="68" y="182" fill="#17344d" font-size="39" font-weight="700">Care journeys,</text>
    <text x="68" y="230" fill="#17344d" font-size="39" font-weight="700">all in one place.</text>
    <text x="70" y="270" fill="#526d7d" font-size="17">Appointments · consultations · prescriptions</text>
    <text x="70" y="296" fill="#526d7d" font-size="17">Health records · follow-up · family care</text>
    <rect x="70" y="326" width="198" height="43" rx="21" fill="#176f83"/>
    <text x="94" y="353" fill="#fff" font-size="14" font-weight="700">PATIENTS · DOCTORS · ADMINS</text>

    <g filter="url(#shadow)">
      <rect x="640" y="52" width="570" height="316" rx="22" fill="#fff"/>
    </g>
    <rect x="640" y="52" width="570" height="48" rx="22" fill="#f8fbfd"/>
    <path d="M640 100h570" stroke="#e9f0f3"/>
    <circle cx="669" cy="76" r="5" fill="#e1a6a6"/>
    <circle cx="687" cy="76" r="5" fill="#e8cf89"/>
    <circle cx="705" cy="76" r="5" fill="#9dcbb4"/>
    <text x="738" y="81" fill="#355266" font-size="13" font-weight="600">CARE DASHBOARD</text>

    <rect x="666" y="119" width="326" height="105" rx="15" fill="#f2f8fb"/>
    <circle cx="707" cy="160" r="23" fill="#d1e9e9"/>
    <path d="M699 160h16M707 152v16" stroke="#177f87" stroke-width="4" stroke-linecap="round"/>
    <text x="745" y="151" fill="#27465c" font-size="14" font-weight="700">Upcoming appointment</text>
    <text x="745" y="174" fill="#698090" font-size="12">Doctor visit · appointment details</text>
    <rect x="745" y="190" width="104" height="18" rx="9" fill="#dcefeb"/>
    <text x="758" y="203" fill="#26756c" font-size="10" font-weight="700">CHECKOUT READY</text>

    <rect x="1010" y="119" width="174" height="105" rx="15" fill="#f5f4ff"/>
    <circle cx="1051" cy="158" r="22" fill="#e3defb"/>
    <path d="M1043 158h16M1051 150v16" stroke="#6958ab" stroke-width="4" stroke-linecap="round"/>
    <text x="1032" y="197" fill="#4a4778" font-size="12" font-weight="700">Care reminders</text>
    <text x="1032" y="213" fill="#79759c" font-size="10">Follow-up support</text>

    <rect x="666" y="241" width="245" height="101" rx="15" fill="#fff8ed"/>
    <rect x="686" y="261" width="35" height="43" rx="7" fill="#f3dfba"/>
    <path d="M694 272h19M694 280h19M694 288h13" stroke="#9e7440" stroke-width="2.5" stroke-linecap="round"/>
    <text x="735" y="273" fill="#655039" font-size="13" font-weight="700">Health records</text>
    <text x="735" y="294" fill="#88765e" font-size="11">Private, organized access</text>
    <text x="735" y="316" fill="#88765e" font-size="10">Illustrative interface element</text>

    <rect x="930" y="241" width="254" height="101" rx="15" fill="#eff8f2"/>
    <circle cx="970" cy="284" r="21" fill="#d5ecdd"/>
    <path d="M959 287c7-13 15-13 22 0M970 274v20" fill="none" stroke="#398258" stroke-width="3" stroke-linecap="round"/>
    <text x="1004" y="273" fill="#315e45" font-size="13" font-weight="700">Connected care</text>
    <text x="1004" y="294" fill="#6b8875" font-size="11">Patient and care team</text>
    <text x="1004" y="316" fill="#6b8875" font-size="10">Conceptual illustration</text>
